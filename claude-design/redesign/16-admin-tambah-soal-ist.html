<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Soal IST — Psikometri Admin</title>
  <link rel="stylesheet" href="./_shared/styles.css">
  <style>
    .answer-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .answer-pill {
      width: 28px;
      height: 28px;
      border-radius: var(--r-pill);
      background: var(--surface-low);
      border: 1px solid var(--outline);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--on-surface-variant);
      flex-shrink: 0;
    }
    .answer-row .input { flex: 1; }
  </style>
</head>
<body>

<div class="breadcrumb" style="margin-bottom:16px;">
  <a class="breadcrumb-item" href="12-admin-bank-soal.html">Bank Soal</a>
  <span class="breadcrumb-sep">›</span>
  <span class="breadcrumb-item">IST</span>
  <span class="breadcrumb-sep">›</span>
  <span class="breadcrumb-item" id="bc-subtes">SE</span>
  <span class="breadcrumb-sep">›</span>
  <span class="breadcrumb-item active">Tambah Soal</span>
</div>

<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
  <div class="page-header-title" style="margin:0;">Tambah Soal IST</div>
  <span class="badge badge-test badge-test-ist" id="badge-subtes">SE</span>
</div>

<div class="form-card">

  <div class="form-card-section">
    <div class="form-section-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      Informasi Soal
    </div>

    <div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;">
      <div class="form-group" style="width:160px;">
        <label class="label">No. Soal <span style="color:var(--error);">*</span></label>
        <input class="input" type="number" placeholder="cth. 1" min="1">
      </div>
      <div class="form-group" style="width:220px;">
        <label class="label">Subtes <span style="color:var(--error);">*</span></label>
        <select class="select" id="subtes-select" onchange="onSubtesChange(this)">
          <option value="SE">SE — Sentence Completion</option>
          <option value="WA">WA — Word Analogies</option>
          <option value="AN">AN — Analogies</option>
          <option value="GE">GE — Gestalt</option>
          <option value="AR">AR — Arithmetic</option>
          <option value="RA">RA — Raven Matrix</option>
          <option value="ZR">ZR — Number Series</option>
          <option value="FA">FA — Form Analogies</option>
          <option value="WU">WU — Cube Counting</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label">Status</label>
        <div style="border:1px solid var(--outline);border-radius:var(--r-md);padding:8px 14px;display:flex;align-items:center;gap:10px;height:36px;">
          <div class="toggle-wrap" onclick="this.querySelector('.toggle').classList.toggle('on')">
            <div class="toggle on"></div>
          </div>
          <span style="font-size:13px;color:var(--on-surface);">Aktif</span>
        </div>
      </div>
    </div>
  </div>

  <div class="form-card-section">
    <div class="form-section-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Konten Soal
    </div>

    <!-- Section SE: teks -->
    <div id="section-teks">
      <div class="form-group" style="margin-bottom:16px;">
        <label class="label">Pertanyaan / Statement <span style="color:var(--error);">*</span></label>
        <textarea class="textarea" id="pertanyaan" rows="3" placeholder="Masukkan pertanyaan atau pernyataan soal..." oninput="updateCount(this,'q-count',200)"></textarea>
        <div class="char-counter"><span id="q-count">0</span>/200 karakter</div>
      </div>
    </div>

    <!-- Section RA: gambar -->
    <div id="section-gambar" style="display:none;margin-bottom:16px;">
      <div class="form-group">
        <label class="label">Gambar Soal <span style="color:var(--error);">*</span></label>
        <div class="dropzone" onclick="this.querySelector('input').click()">
          <input type="file" accept="image/*" style="display:none;">
          <div class="dropzone-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
          </div>
          <div class="dropzone-label">Klik atau seret gambar ke sini</div>
          <div class="dropzone-hint">PNG, JPG, SVG — maks. 2MB</div>
        </div>
      </div>
    </div>

    <!-- Opsi jawaban A–E (selalu tampil) -->
    <div>
      <label class="label" style="margin-bottom:10px;">Opsi Jawaban <span style="color:var(--error);">*</span></label>
      <div class="answer-row">
        <div class="answer-pill">A</div>
        <input class="input" type="text" placeholder="Opsi jawaban A">
      </div>
      <div class="answer-row">
        <div class="answer-pill">B</div>
        <input class="input" type="text" placeholder="Opsi jawaban B">
      </div>
      <div class="answer-row">
        <div class="answer-pill">C</div>
        <input class="input" type="text" placeholder="Opsi jawaban C">
      </div>
      <div class="answer-row">
        <div class="answer-pill">D</div>
        <input class="input" type="text" placeholder="Opsi jawaban D">
      </div>
      <div class="answer-row">
        <div class="answer-pill">E</div>
        <input class="input" type="text" placeholder="Opsi jawaban E">
      </div>
    </div>

    <div class="form-group" style="margin-top:16px;max-width:200px;">
      <label class="label">Jawaban Benar <span style="color:var(--error);">*</span></label>
      <select class="select">
        <option value="">Pilih jawaban...</option>
        <option>A</option>
        <option>B</option>
        <option>C</option>
        <option>D</option>
        <option>E</option>
      </select>
    </div>
  </div>

  <div class="form-card-footer" style="justify-content:space-between;">
    <div class="info-note">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      Soal akan disimpan ke Bank Soal IST
    </div>
    <div style="display:flex;gap:8px;">
      <a href="12-admin-bank-soal.html" class="btn btn-outline">Batal</a>
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:14px;height:14px;stroke-width:1.75;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
        Simpan Soal
      </button>
    </div>
  </div>
</div>

<script src="./_shared/shell.js"></script>
<script src="./_shared/utils.js" defer></script>
<script>
  initShell({
    role: 'admin',
    activeHref: '12-admin-bank-soal.html',
    user: { name: 'Superadmin', role: 'Superadmin', initials: 'AS' },
    notifCount: 6
  });

  const gambarSubtes = ['RA', 'FA', 'WU', 'GE'];

  function onSubtesChange(sel) {
    const val = sel.value;
    const isGambar = gambarSubtes.includes(val);
    document.getElementById('section-teks').style.display = isGambar ? 'none' : 'block';
    document.getElementById('section-gambar').style.display = isGambar ? 'block' : 'none';
    document.getElementById('badge-subtes').textContent = val;
    document.getElementById('bc-subtes').textContent = val;
  }

  function updateCount(el, countId) {
    document.getElementById(countId).textContent = el.value.length;
  }
</script>
</body>
</html>
