<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Soal WWQ — Psikometri Admin</title>
  <link rel="stylesheet" href="./_shared/styles.css">
  <style>
    .scale-section-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--on-surface-faint); margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="breadcrumb" style="margin-bottom:16px;">
  <a class="breadcrumb-item" href="12-admin-bank-soal.html">Bank Soal</a>
  <span class="breadcrumb-sep">›</span>
  <span class="breadcrumb-item">WWQ</span>
  <span class="breadcrumb-sep">›</span>
  <span class="breadcrumb-item active">Tambah Soal</span>
</div>

<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
  <div class="page-header-title" style="margin:0;">Tambah Soal WWQ</div>
  <span class="badge badge-test badge-test-wwq">WWQ</span>
</div>

<div class="form-card">

  <div class="form-card-section">
    <div class="form-section-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      Informasi Soal
    </div>

    <div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;">
      <div class="form-group" style="width:180px;">
        <label class="label">No. Soal <span style="color:var(--error);">*</span></label>
        <input class="input" type="number" placeholder="cth. 1" min="1">
      </div>
      <div class="form-group" style="flex:1;min-width:200px;">
        <label class="label">Tipe Scoring <span style="color:var(--error);">*</span></label>
        <select class="select">
          <option value="">Pilih tipe scoring...</option>
          <option>Skala Langsung</option>
          <option>Skala Terbalik</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label">Status</label>
        <div style="border:1px solid var(--outline);border-radius:var(--r-md);padding:8px 14px;display:flex;align-items:center;gap:10px;height:36px;">
          <div class="toggle-wrap" onclick="this.querySelector('.toggle').classList.toggle('on')">
            <div class="toggle on"></div>
          </div>
          <span style="font-size:13px;color:var(--on-surface);">Aktif</span>
        </div>
      </div>
    </div>
  </div>

  <div class="form-card-section">
    <div class="form-section-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Konten Soal
    </div>

    <div class="form-group">
      <label class="label">Pertanyaan / Statement <span style="color:var(--error);">*</span></label>
      <textarea class="textarea" id="stmt" rows="3" placeholder="Masukkan pernyataan soal..." oninput="updateCount(this,'stmt-count',150)"></textarea>
      <div class="char-counter"><span id="stmt-count">0</span>/150 karakter</div>
    </div>
  </div>

  <div class="form-card-section">
    <div class="form-section-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Mapping Skala
    </div>
    <div class="form-help" style="margin-bottom:12px;">Pilih skala yang relevan dengan pernyataan ini.</div>
    <div class="checkbox-grid">
      <label class="checkbox-grid-item">
        <input type="checkbox" onchange="this.closest('.checkbox-grid-item').classList.toggle('checked',this.checked)">
        Skala 1 — Obsesi
      </label>
      <label class="checkbox-grid-item">
        <input type="checkbox" onchange="this.closest('.checkbox-grid-item').classList.toggle('checked',this.checked)">
        Skala 2 — Impulsif
      </label>
      <label class="checkbox-grid-item">
        <input type="checkbox" onchange="this.closest('.checkbox-grid-item').classList.toggle('checked',this.checked)">
        Skala 3 — Sensitif
      </label>
      <label class="checkbox-grid-item">
        <input type="checkbox" onchange="this.closest('.checkbox-grid-item').classList.toggle('checked',this.checked)">
        Skala 4 — Depresi
      </label>
      <label class="checkbox-grid-item">
        <input type="checkbox" onchange="this.closest('.checkbox-grid-item').classList.toggle('checked',this.checked)">
        Skala 5 — Kecemasan
      </label>
      <label class="checkbox-grid-item">
        <input type="checkbox" onchange="this.closest('.checkbox-grid-item').classList.toggle('checked',this.checked)">
        Skala 6 — Paranoia
      </label>
      <label class="checkbox-grid-item">
        <input type="checkbox" onchange="this.closest('.checkbox-grid-item').classList.toggle('checked',this.checked)">
        Skala 7 — Psikotik
      </label>
      <label class="checkbox-grid-item">
        <input type="checkbox" onchange="this.closest('.checkbox-grid-item').classList.toggle('checked',this.checked)">
        Skala 8 — Hipokondria
      </label>
    </div>
  </div>

  <div class="form-card-footer" style="justify-content:space-between;">
    <div class="info-note">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      Soal akan disimpan ke Bank Soal WWQ
    </div>
    <div style="display:flex;gap:8px;">
      <a href="12-admin-bank-soal.html" class="btn btn-outline">Batal</a>
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:14px;height:14px;stroke-width:1.75;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
        Simpan Soal
      </button>
    </div>
  </div>
</div>

<script src="./_shared/shell.js"></script>
<script src="./_shared/utils.js" defer></script>
<script>
  initShell({
    role: 'admin',
    activeHref: '12-admin-bank-soal.html',
    user: { name: 'Superadmin', role: 'Superadmin', initials: 'AS' },
    notifCount: 6
  });
  function updateCount(el, countId, max) {
    document.getElementById(countId).textContent = el.value.length;
  }
</script>
</body>
</html>
