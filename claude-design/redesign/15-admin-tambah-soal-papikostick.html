<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Soal PAPIKOSTICK — Psikometri Admin</title>
  <link rel="stylesheet" href="./_shared/styles.css">
  <style>
    .sub-card {
      background: var(--surface-low);
      border-radius: var(--r-md);
      padding: 20px;
    }
    .sub-card-title {
      font-size: 13px; font-weight: 600; color: var(--on-surface);
      margin-bottom: 14px;
    }
  </style>
</head>
<body>

<div class="breadcrumb" style="margin-bottom:16px;">
  <a class="breadcrumb-item" href="12-admin-bank-soal.html">Bank Soal</a>
  <span class="breadcrumb-sep">›</span>
  <span class="breadcrumb-item">PAPIKOSTICK</span>
  <span class="breadcrumb-sep">›</span>
  <span class="breadcrumb-item active">Tambah Soal</span>
</div>

<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
  <div class="page-header-title" style="margin:0;">Tambah Soal PAPIKOSTICK</div>
  <span class="badge badge-test badge-test-papikostick">PAPIKOSTICK</span>
</div>

<div class="form-card">

  <div class="form-card-section">
    <div class="form-section-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      Informasi Soal
    </div>

    <div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;">
      <div class="form-group" style="width:180px;">
        <label class="label">No. Soal <span style="color:var(--error);">*</span></label>
        <input class="input" type="number" placeholder="cth. 1" min="1">
      </div>
      <div class="form-group">
        <label class="label">Status</label>
        <div style="border:1px solid var(--outline);border-radius:var(--r-md);padding:8px 14px;display:flex;align-items:center;gap:10px;height:36px;">
          <div class="toggle-wrap" onclick="this.querySelector('.toggle').classList.toggle('on')">
            <div class="toggle on"></div>
          </div>
          <span style="font-size:13px;color:var(--on-surface);">Aktif</span>
        </div>
      </div>
    </div>
  </div>

  <div class="form-card-section">
    <div class="form-section-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Konten Soal
    </div>

    <div class="sub-card">
      <div class="sub-card-title">Pasangan Pernyataan</div>
      <div class="form-row form-row-2">
        <div class="form-group">
          <label class="label">Pernyataan A <span style="color:var(--error);">*</span></label>
          <textarea class="textarea" id="pA" rows="4" placeholder="Masukkan pernyataan A..." oninput="updateCount(this,'pA-count',150)"></textarea>
          <div class="char-counter"><span id="pA-count">0</span>/150 karakter</div>
        </div>
        <div class="form-group">
          <label class="label">Pernyataan B <span style="color:var(--error);">*</span></label>
          <textarea class="textarea" id="pB" rows="4" placeholder="Masukkan pernyataan B..." oninput="updateCount(this,'pB-count',150)"></textarea>
          <div class="char-counter"><span id="pB-count">0</span>/150 karakter</div>
        </div>
      </div>
    </div>
  </div>

  <div class="form-card-section">
    <div class="form-section-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Mapping Faktor
    </div>

    <div class="sub-card">
      <div class="form-row form-row-2" style="margin-bottom:16px;">
        <div class="form-group">
          <label class="label">Faktor A <span style="color:var(--error);">*</span></label>
          <select class="select">
            <option value="">Pilih faktor...</option>
            <option>N — Need to Finish Task</option>
            <option>G — Hard Intense Worker</option>
            <option>A — Need for Achievement</option>
            <option>L — Need to Lead</option>
            <option>P — Need to Control Others</option>
            <option>I — Ease in Decision Making</option>
            <option>T — Need to be Noticed</option>
            <option>V — Vigorous Type</option>
            <option>X — Need for Change</option>
            <option>S — Social Extension</option>
            <option>B — Need to be Supportive</option>
            <option>O — Need for Rules & Supervision</option>
            <option>R — Theoretical Type</option>
            <option>D — Need for Closeness & Affection</option>
            <option>C — Organized Type</option>
            <option>Z — Need for Change</option>
            <option>E — Emotional Resistant</option>
            <option>K — Need to be Aggressive</option>
            <option>F — Need for Status</option>
            <option>W — Need for Belonging to Groups</option>
          </select>
        </div>
        <div class="form-group">
          <label class="label">Faktor B <span style="color:var(--error);">*</span></label>
          <select class="select">
            <option value="">Pilih faktor...</option>
            <option>N — Need to Finish Task</option>
            <option>G — Hard Intense Worker</option>
            <option>A — Need for Achievement</option>
            <option>L — Need to Lead</option>
            <option>P — Need to Control Others</option>
            <option>I — Ease in Decision Making</option>
            <option>T — Need to be Noticed</option>
            <option>V — Vigorous Type</option>
            <option>X — Need for Change</option>
            <option>S — Social Extension</option>
            <option>B — Need to be Supportive</option>
            <option>O — Need for Rules & Supervision</option>
            <option>R — Theoretical Type</option>
            <option>D — Need for Closeness & Affection</option>
            <option>C — Organized Type</option>
            <option>Z — Need for Change</option>
            <option>E — Emotional Resistant</option>
            <option>K — Need to be Aggressive</option>
            <option>F — Need for Status</option>
            <option>W — Need for Belonging to Groups</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="label">Kontribusi pada Skor</label>
        <div class="form-help" style="margin-bottom:8px;">Pernyataan mana yang berkontribusi pada skor faktor?</div>
        <div class="factor-btns">
          <button type="button" class="factor-btn active" onclick="setFactor(this)">A</button>
          <button type="button" class="factor-btn" onclick="setFactor(this)">B</button>
        </div>
      </div>
    </div>
  </div>

  <div class="form-card-footer" style="justify-content:space-between;">
    <div class="info-note">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      Soal akan disimpan ke Bank Soal PAPIKOSTICK
    </div>
    <div style="display:flex;gap:8px;">
      <a href="12-admin-bank-soal.html" class="btn btn-outline">Batal</a>
      <button class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:14px;height:14px;stroke-width:1.75;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
        Simpan Soal
      </button>
    </div>
  </div>
</div>

<script src="./_shared/shell.js"></script>
<script src="./_shared/utils.js" defer></script>
<script>
  initShell({
    role: 'admin',
    activeHref: '12-admin-bank-soal.html',
    user: { name: 'Superadmin', role: 'Superadmin', initials: 'AS' },
    notifCount: 6
  });
  function updateCount(el, countId) {
    document.getElementById(countId).textContent = el.value.length;
  }
  function setFactor(btn) {
    btn.closest('.factor-btns').querySelectorAll('.factor-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
</script>
</body>
</html>
