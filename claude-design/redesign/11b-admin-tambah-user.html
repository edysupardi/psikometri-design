<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah User — Psikometri Admin</title>
  <link rel="stylesheet" href="./_shared/styles.css">
  <style>
    .form-card-footer { justify-content: flex-end; }
  </style>
</head>
<body>

<div class="breadcrumb" style="margin-bottom:16px;">
  <a class="breadcrumb-item" href="11-admin-manajemen-user.html">Manajemen User</a>
  <span class="breadcrumb-sep">›</span>
  <span class="breadcrumb-item active">Tambah User</span>
</div>

<div class="page-header" style="margin-bottom:20px;">
  <div class="page-header-title">Tambah User Baru</div>
  <div class="page-header-desc">Isi data di bawah untuk mendaftarkan pengguna baru ke platform.</div>
</div>

<div class="form-card">
  <!-- Informasi Dasar -->
  <div class="form-card-section">
    <div class="form-section-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Informasi Dasar
    </div>
    <div class="form-row form-row-2" style="margin-bottom:14px;">
      <div class="form-group">
        <label class="label">Nama Lengkap <span style="color:var(--error);">*</span></label>
        <input class="input" type="text" placeholder="Masukkan nama lengkap">
      </div>
      <div class="form-group">
        <label class="label">Email <span style="color:var(--error);">*</span></label>
        <input class="input" type="email" placeholder="email@domain.com">
      </div>
    </div>
    <div class="form-row form-row-2">
      <div class="form-group">
        <label class="label">Tanggal Lahir</label>
        <input class="input" type="date">
      </div>
      <div class="form-group">
        <label class="label">Jenis Kelamin</label>
        <select class="select">
          <option value="">Pilih...</option>
          <option>Laki-laki</option>
          <option>Perempuan</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Akses & Role -->
  <div class="form-card-section">
    <div class="form-section-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Akses & Role
    </div>
    <div class="form-row form-row-2">
      <div class="form-group">
        <label class="label">Role <span style="color:var(--error);">*</span></label>
        <select class="select">
          <option value="">Pilih role...</option>
          <option>Publik — Pengguna asesmen mandiri</option>
          <option>Psikolog — Review & approval hasil</option>
          <option>B2B Admin — Kelola pesanan perusahaan</option>
          <option>Admin — Kelola seluruh sistem</option>
          <option>Superadmin — Akses penuh</option>
        </select>
        <div class="form-help">Role menentukan halaman dan fitur yang dapat diakses user.</div>
      </div>
      <div class="form-group">
        <label class="label">Status</label>
        <select class="select">
          <option>Aktif</option>
          <option>Tidak Aktif</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Password -->
  <div class="form-card-section">
    <div class="form-section-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Password Sementara
    </div>
    <div style="max-width:340px;">
      <div class="form-group" style="margin-bottom:8px;">
        <label class="label">Password <span style="color:var(--error);">*</span></label>
        <div class="input-group suffix">
          <input class="input" type="password" id="pwd-field" placeholder="Min. 8 karakter">
          <div class="input-suffix">
            <button type="button" onclick="document.getElementById('pwd-field').type=document.getElementById('pwd-field').type==='password'?'text':'password'">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:14px;height:14px;stroke-width:1.75;"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="info-note">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        User akan diminta mengganti password saat login pertama.
      </div>
    </div>
  </div>

  <div class="form-card-footer">
    <a href="11-admin-manajemen-user.html" class="btn btn-outline">Batal</a>
    <button class="btn btn-primary">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:14px;height:14px;stroke-width:1.75;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Simpan User
    </button>
  </div>
</div>

<script src="./_shared/shell.js"></script>
<script src="./_shared/utils.js" defer></script>
<script>
  initShell({
    role: 'admin',
    activeHref: '11-admin-manajemen-user.html',
    user: { name: 'Superadmin', role: 'Superadmin', initials: 'AS' },
    notifCount: 6
  });
</script>
</body>
</html>
